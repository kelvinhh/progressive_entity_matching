[project]
name = "progressive-entity-matching"
version = "0.1.0"
description = "Independent course replication of progressive entity matching scheduling"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]
